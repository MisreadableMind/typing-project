version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taptaptap-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taptaptap
    ports:
      - "5533:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taptaptap

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taptaptap-backend
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=taptaptap
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - taptaptap

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: taptaptap-ui
    environment:
      - API_URL=http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./ui:/app
      - /app/node_modules
    networks:
      - taptaptap

networks:
  taptaptap:
    driver: bridge

volumes:
  postgres_data:
